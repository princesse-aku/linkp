services:
  # Émulateurs Firebase : Auth (9099), Firestore (8080), interface (http://localhost:4000)
  firebase:
    build: ./emulators
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-linkp}
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9099:9099"
    volumes:
      - emulator-data:/data
      - emulator-cache:/root/.cache
    stop_grace_period: 30s
    healthcheck:
      # Prêt seulement quand Firestore (8080) ET Auth (9099) répondent
      test: ["CMD", "node", "-e", "const h=require('http');const ping=(p)=>new Promise((ok,ko)=>h.get('http://127.0.0.1:'+p,r=>r.statusCode<500?ok():ko()).on('error',ko));Promise.all([ping(8080),ping(9099)]).then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Boîte mail de développement : les emails envoyés par l'API arrivent ici (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Adresses internes au réseau Docker (le navigateur, lui, utilise localhost)
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      firebase:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/tests:/code/tests

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  emulator-data:
  emulator-cache:
